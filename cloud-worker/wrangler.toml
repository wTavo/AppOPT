name = "appopt-shared-services"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Base de datos SQLite sin servidor en Cloudflare D1 (100% gratuita, sin tarjeta de crédito)
[[d1_databases]]
binding = "APPOPT_SHARES_DB"
database_name = "appopt_shares_db"
database_id = "f3b45f90-3167-4857-bc52-029fad102906"

# Instrucciones de despliegue:
# 1. Crear base D1: npx wrangler d1 create appopt_shares_db
# 2. Aplicar esquema: npx wrangler d1 execute appopt_shares_db --remote --file=./schema.sql
# 3. Configurar llave maestra AES-256-GCM (64 caracteres hex): npx wrangler secret put SERVER_MASTER_KEY
# 4. Desplegar Worker: npx wrangler deploy
